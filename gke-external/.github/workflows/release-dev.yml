name: Dev Release

# Feature and fix branches deploy to the dev environment (GitHub environment totoexperiments, GKE namespace dev).
# main does NOT deploy to dev: it deploys to prod (release-prod.yml).
on:
  push:
    branches:
      - 'feature/**'
      - 'issue/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Two deploys to the same environment must not race
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  release:
    name: Build & Deploy to Cloud Run and GKE
    environment: totoexperiments
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PID }}
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Create Environment Variables
        run: |
          PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
          PACKAGE_NAME=$(cat package.json | grep name | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
          # Dev tag: <version>-<short sha>. Unique per commit, no version bump needed on feature branches.
          IMAGE_TAG=${PACKAGE_VERSION}-${GITHUB_SHA::7}
          IMAGE=europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${PACKAGE_NAME}/${PACKAGE_NAME}:${IMAGE_TAG}
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # On a re-run for the same commit the image may already exist: skip build and push, just redeploy it.
      - name: Check if image already exists
        run: |
          if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists: skipping build and push."
            echo "IMAGE_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        if: env.IMAGE_EXISTS != 'true'
        run: docker build . -t "$IMAGE"

      - name: Push Docker image
        if: env.IMAGE_EXISTS != 'true'
        run: docker push "$IMAGE"

      # ---------------------------------------------------------------
      # CLOUD RUN
      # Comment out this step if the microservice is not deployed on Cloud Run.
      # Add the microservice's own env vars to --set-env-vars.
      # ---------------------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.PACKAGE_NAME }} --set-env-vars "HYPERSCALER=gcp,GCP_PID=${{ vars.GCP_PID }},SERVICE_BASE_URL=${{ secrets.SERVICE_BASE_URL }},GALE_BROKER_URL=${{ secrets.GALE_BROKER_URL }}" --service-account=${{ secrets.SERVICE_ACCOUNT }} --project=${{ vars.GCP_PID }} --image="$IMAGE" --platform=managed --region=europe-west1 --allow-unauthenticated

      # ---------------------------------------------------------------
      # GKE
      # Comment out the two steps below if the microservice is not deployed on GKE.
      # The Deployment is created by Terraform (toto-terra-gke): CI only changes its image.
      # The Deployment and its container are named after package.json "name".
      # ---------------------------------------------------------------
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ vars.GKE_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}

      - name: Deploy to GKE
        run: |
          # First deploy of a new microservice: the Deployment does not exist yet. Don't fail:
          # the image is pushed, create the Deployment with toto-terra-gke using this tag.
          if ! OUTPUT=$(kubectl -n ${{ vars.GKE_NAMESPACE }} get deployment/${PACKAGE_NAME} 2>&1); then
            if echo "$OUTPUT" | grep -q 'NotFound'; then
              echo "::warning::Deployment ${PACKAGE_NAME} not found in namespace ${{ vars.GKE_NAMESPACE }}: create it with toto-terra-gke using image tag ${IMAGE_TAG}. Skipping the GKE deploy."
              exit 0
            fi
            echo "::error::Could not check whether Deployment ${PACKAGE_NAME} exists: $OUTPUT"
            exit 1
          fi

          kubectl -n ${{ vars.GKE_NAMESPACE }} set image deployment/${PACKAGE_NAME} ${PACKAGE_NAME}="$IMAGE"
          kubectl -n ${{ vars.GKE_NAMESPACE }} rollout status deployment/${PACKAGE_NAME} --timeout=5m
